name: Publish npm packages

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish with npm trusted publishing
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require a release from main
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm 11.5.1+; pin the tested CLI version.
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: node scripts/check-release.mjs
      - run: npm run build --workspace @mcgui/core
      - run: npm run build --workspace @mcgui/assets
      - run: npm run build --workspace @mcgui/react
      - run: npm run check:packages
      - name: Publish packages in dependency order
        run: node scripts/publish-packages.mjs
